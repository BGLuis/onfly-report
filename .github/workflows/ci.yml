name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout repository code
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run linter (ruff)
        run: ruff check .

      - name: Run test suite (pytest)
        run: pytest -q

      - name: Verify CLI execution on validation sample and full dataset
        run: |
          PYTHONPATH=src python -m onfly_report \
            --input data/exemplo-validacao.csv \
            --rates data/taxas_cambio.csv \
            --output output/exemplo.json
          PYTHONPATH=src python -m onfly_report \
            --input data/reservas_hoteis.csv \
            --rates data/taxas_cambio.csv \
            --output output/report.json
